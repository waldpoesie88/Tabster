<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="tabsterBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0086f0"/>
      <stop offset="100%" stop-color="#005a9e"/>
    </linearGradient>
  </defs>
  
  <!-- Синий скруглённый фон (как у стандартной иконки, но в фирменном цвете) -->
  <rect width="128" height="128" rx="28" fill="url(#tabsterBlue)"/>
  
  <!-- Буква T, сдвинутая чуть влево -->
  <!-- Верхняя перекладина T -->
  <rect x="24" y="28" width="54" height="14" rx="4" fill="#ffffff"/>
  <!-- Вертикальный ствол T -->
  <rect x="44" y="28" width="14" height="72" rx="4" fill="#ffffff"/>
  
  <!-- Три полоски-вкладки, отходящие вправо от ствола буквы T -->
  <!-- Верхняя вкладка (белая) -->
  <rect x="65" y="52" width="39" height="10" rx="5" fill="#ffffff" fill-opacity="0.9"/>
  <!-- Средняя вкладка (зелёная — акцент защищённой вкладки) -->
  <rect x="65" y="70" width="39" height="10" rx="5" fill="#4ade80"/>
  <!-- Нижняя вкладка (полупрозрачная белая) -->
  <rect x="65" y="88" width="31" height="10" rx="5" fill="#ffffff" fill-opacity="0.6"/>
</svg>





